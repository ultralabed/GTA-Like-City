<title>夕陽小房間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D view; a thin HUD floats on top (name top-left, switches under it, hint at the bottom). Single dark look on purpose. */
:root{
  color-scheme: dark;
  --ink:#0b0710;            /* room-at-night black, biased to violet */
  --glass:rgba(18,10,26,.58);
  --line:rgba(255,214,190,.22);
  --text:#fff1e6;           /* warm paper white */
  --muted:#d9bfc4;
  --sun:#ff9a4d;            /* sunset orange = accent */
  --neon:#ff4fa8;           /* neon pink = "on" state */
  --display:"Unbounded","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Inter","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;position:relative;
  -webkit-user-select:none;user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em;
  text-shadow:0 2px 18px rgba(0,0,0,.7)}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.bar{display:flex;align-items:center;gap:12px;pointer-events:auto;max-width:100%}
.bar output{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;
  width:min(100%,21rem);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel h2{margin:6px 0 0;font:600 11px/1 var(--body);letter-spacing:.08em;color:var(--muted)}
.panel h2:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input{flex:1 1 7rem;min-width:0;accent-color:var(--sun)}
.bar button,.panel button,.acts button{font:600 13px/1 var(--body);color:var(--text);background:var(--glass);border:1px solid var(--line);
  padding:10px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar button,.acts button{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel button{background:rgba(255,255,255,.07)}
.panel button:not(.plain)::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.panel button[aria-pressed="true"]::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.bar button[aria-expanded="true"]{border-color:var(--sun)}
.bar button:hover,.panel button:hover,.acts button:hover{border-color:var(--sun)}
.bar button:focus-visible,.panel button:focus-visible,.panel input:focus-visible,.acts button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.acts{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.acts button{pointer-events:auto;padding:12px 16px;font-size:14px}
.speed{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.bag{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.bag button{padding:9px 12px;font-size:12px}
.bag button::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.bag button[aria-pressed="true"]::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.actcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
/* short screens (a phone held sideways): the buttons go in rows instead of one tall column, and sit lower */
@media (max-height:520px){
  .acts{bottom:calc(12px + env(safe-area-inset-bottom, 0px));gap:5px;max-width:58vw}
  .actcol{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:6px}
  .acts button{padding:9px 12px;font-size:13px}
  .bag button{padding:7px 10px}
  .speed{font-size:15px;padding:6px 10px}
  .radar{bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
  .radar canvas{width:88px;height:88px}
}
.map{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none;line-height:0}
.map canvas{width:min(208px,46vw);height:auto;display:block}
.radar{border-radius:50%;border-width:2px;top:auto;right:auto;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
.radar canvas{width:104px;height:104px}
.acts kbd{font:600 11px/1 var(--body);color:var(--sun);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.hint{align-self:center;text-align:center;font-size:13px;line-height:1.5;color:var(--text);background:var(--glass);
  border:1px solid var(--line);border-radius:12px;padding:8px 14px;max-width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hint b{color:var(--sun);font-weight:600}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
#tip{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--sun);border-radius:8px;padding:6px 10px;pointer-events:none;white-space:nowrap}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.06);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,154,77,.55)}
.minds{white-space:pre-line;font-variant-numeric:tabular-nums;color:var(--text)}
body.photo .hud,body.photo #tags,body.photo #cross,body.photo #tip,body.photo .acts,body.photo #map,body.photo #radar,body.photo #talk{display:none!important}
.photoend{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));font:600 12px/1 var(--body);color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 12px;opacity:.55;cursor:pointer}
.photoend:hover,.photoend:focus-visible{opacity:1}
.quest{color:var(--text);border-color:var(--sun)}
.talk{position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:min(calc(100% - 32px),26rem);pointer-events:auto;
  background:var(--glass);border:1px solid var(--sun);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.talk strong{flex:1 0 100%;font:700 14px/1.2 var(--display)}
.talk p{flex:1 0 100%;margin:0;font-size:14px;line-height:1.5}
.talk button{font:600 13px/1 var(--body);color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);padding:10px 13px;border-radius:999px;cursor:pointer}
.talk button:hover{border-color:var(--sun)}
.talk button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.phys{font-size:12px;line-height:1.45;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;max-width:min(100%,30em);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.6}
</style>

<canvas id="view" tabindex="0" aria-label="可以走動探索的 3D 街道和房子"></canvas>
<div id="cross"></div>
<div id="tip" hidden></div>
<div id="joy" hidden><i></i></div>
<div id="tags"></div>
<div class="hud">
  <div class="top">
    <div class="bar">
      <h1>夕陽街<small id="sub">海邊的一條小街</small></h1>
      <output id="clk" for="time">17:24</output>
      <output id="cash">$60</output>
      <button id="bSet" type="button" aria-expanded="false" aria-controls="panel">設定</button>
    </div>
    <div id="panel" class="panel" hidden>
      <h2>時間和天氣</h2>
      <div class="row"><input id="time" type="range" min="0" max="23.99" step="0.01" value="17.4" aria-label="現在幾點"><button id="bSpeed" type="button" class="plain">時間：正常</button></div>
      <div class="row"><button id="bRain" type="button" class="plain">天氣：晴天</button></div>
      <h2>最近這間房子</h2>
      <div class="row"><button id="bLamp" type="button" aria-pressed="false">立燈</button><button id="bTv" type="button" aria-pressed="true">電視</button><button id="bNeon" type="button" aria-pressed="true">霓虹燈</button></div>
      <h2>物理</h2>
      <div class="row"><button id="bGrav" type="button" class="plain">重力：地球</button><button id="bOrb" type="button" aria-pressed="false">引力球</button></div>
      <h2>看更多</h2>
      <div class="row"><button id="bMind" type="button" aria-pressed="false">居民的想法</button><button id="bRadar" type="button" class="plain">小地圖：開</button><button id="bStats" type="button" class="plain">我的紀錄</button><button id="bSound" type="button" class="plain">聲音：開</button><button id="bMusic" type="button" class="plain">音樂：開</button><button id="bQual" type="button" class="plain">畫質：高</button><button id="bView" type="button" class="plain">視角：第一人稱</button><button id="bPhoto" type="button" class="plain">拍照模式</button><button id="bReset" type="button" class="plain">重新開始</button><button id="bHelp" type="button" class="plain">操作說明</button></div>
    </div>
    <div id="quest" class="phys quest" hidden></div>
    <div id="phys" class="phys" hidden></div>
    <div id="minds" class="phys minds" hidden></div>
  </div>
  <div class="acts"><output id="speed" class="speed" hidden>0 km/h</output><div id="bag" class="bag"></div><div id="acts" class="actcol"></div></div>
  <div id="talk" class="talk" hidden></div>
  <div id="radar" class="map radar"><canvas id="radarc" width="208" height="208" aria-label="小雷達地圖"></canvas></div>
  <div id="map" class="map" hidden><canvas id="mapc" width="416" height="280" aria-label="街道地圖"></canvas></div>
  <div class="hint" id="hint"></div>
</div>
<button id="bPhotoEnd" type="button" class="photoend" hidden>結束拍照</button>
<div id="err" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
