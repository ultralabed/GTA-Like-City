<title>夕陽小房間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D view; a thin HUD floats on top (name top-left, switches under it, hint at the bottom). Single dark look on purpose. */
:root{
  color-scheme: dark;
  --ink:#0b0710;            /* room-at-night black, biased to violet */
  --glass:rgba(18,10,26,.58);
  --line:rgba(255,214,190,.22);
  --text:#fff1e6;           /* warm paper white */
  --muted:#d9bfc4;
  --sun:#ff9a4d;            /* sunset orange = accent */
  --neon:#ff4fa8;           /* neon pink = "on" state */
  --display:"Unbounded","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Inter","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;position:relative;
  -webkit-user-select:none;user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em;
  text-shadow:0 2px 18px rgba(0,0,0,.7)}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.bar{display:flex;align-items:center;gap:12px;pointer-events:auto;max-width:100%}
.bar output{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;
  width:min(100%,21rem);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel h2{margin:6px 0 0;font:600 11px/1 var(--body);letter-spacing:.08em;color:var(--muted)}
.panel h2:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input{flex:1 1 7rem;min-width:0;accent-color:var(--sun)}
.bar button,.panel button,.acts button{font:600 13px/1 var(--body);color:var(--text);background:var(--glass);border:1px solid var(--line);
  padding:10px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.bar button,.acts button{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.panel button{background:rgba(255,255,255,.07)}
.panel button:not(.plain)::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.panel button[aria-pressed="true"]::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.bar button[aria-expanded="true"]{border-color:var(--sun)}
.bar button:hover,.panel button:hover,.acts button:hover{border-color:var(--sun)}
.bar button:focus-visible,.panel button:focus-visible,.panel input:focus-visible,.acts button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.acts{position:absolute;right:max(16px, env(safe-area-inset-right, 0px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.acts button{pointer-events:auto;padding:12px 16px;font-size:14px}
.speed{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.bag{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.bag button{padding:9px 12px;font-size:12px}
.bag button::before{content:"";width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25)}
.bag button[aria-pressed="true"]::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.actcol{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.map{position:absolute;top:calc(14px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none;line-height:0}
.map canvas{width:min(208px,46vw);height:auto;display:block}
.acts kbd{font:600 11px/1 var(--body);color:var(--sun);border:1px solid var(--line);border-radius:5px;padding:3px 5px}
.hint{align-self:center;text-align:center;font-size:13px;line-height:1.5;color:var(--text);background:var(--glass);
  border:1px solid var(--line);border-radius:12px;padding:8px 14px;max-width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hint b{color:var(--sun);font-weight:600}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
#tip{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--sun);border-radius:8px;padding:6px 10px;pointer-events:none;white-space:nowrap}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.06);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,154,77,.55)}
.minds{white-space:pre-line;font-variant-numeric:tabular-nums;color:var(--text)}
body.photo .hud,body.photo #tags,body.photo #cross,body.photo #tip,body.photo .acts,body.photo #map,body.photo #talk{display:none!important}
.photoend{position:absolute;left:max(16px, env(safe-area-inset-left, 0px));bottom:calc(16px + env(safe-area-inset-bottom, 0px));font:600 12px/1 var(--body);color:var(--text);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:9px 12px;opacity:.55;cursor:pointer}
.photoend:hover,.photoend:focus-visible{opacity:1}
.quest{color:var(--text);border-color:var(--sun)}
.talk{position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);width:min(calc(100% - 32px),26rem);pointer-events:auto;
  background:var(--glass);border:1px solid var(--sun);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.talk strong{flex:1 0 100%;font:700 14px/1.2 var(--display)}
.talk p{flex:1 0 100%;margin:0;font-size:14px;line-height:1.5}
.talk button{font:600 13px/1 var(--body);color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);padding:10px 13px;border-radius:999px;cursor:pointer}
.talk button:hover{border-color:var(--sun)}
.talk button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.phys{font-size:12px;line-height:1.45;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;max-width:min(100%,30em);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.6}
</style>

<canvas id="view" tabindex="0" aria-label="可以走動探索的 3D 街道和房子"></canvas>
<div id="cross"></div>
<div id="tip" hidden></div>
<div id="joy" hidden><i></i></div>
<div id="tags"></div>
<div class="hud">
  <div class="top">
    <div class="bar">
      <h1>夕陽街<small id="sub">海邊的一條小街</small></h1>
      <output id="clk" for="time">17:24</output>
      <output id="cash">$60</output>
      <button id="bSet" type="button" aria-expanded="false" aria-controls="panel">設定</button>
    </div>
    <div id="panel" class="panel" hidden>
      <h2>時間和天氣</h2>
      <div class="row"><input id="time" type="range" min="0" max="23.99" step="0.01" value="17.4" aria-label="現在幾點"><button id="bSpeed" type="button" class="plain">時間：正常</button></div>
      <div class="row"><button id="bRain" type="button" class="plain">天氣：晴天</button></div>
      <h2>最近這間房子</h2>
      <div class="row"><button id="bLamp" type="button" aria-pressed="false">立燈</button><button id="bTv" type="button" aria-pressed="true">電視</button><button id="bNeon" type="button" aria-pressed="true">霓虹燈</button></div>
      <h2>物理</h2>
      <div class="row"><button id="bGrav" type="button" class="plain">重力：地球</button><button id="bOrb" type="button" aria-pressed="false">引力球</button></div>
      <h2>看更多</h2>
      <div class="row"><button id="bMind" type="button" aria-pressed="false">居民的想法</button><button id="bSound" type="button" class="plain">聲音：開</button><button id="bMusic" type="button" class="plain">音樂：開</button><button id="bQual" type="button" class="plain">畫質：高</button><button id="bView" type="button" class="plain">視角：第一人稱</button><button id="bPhoto" type="button" class="plain">拍照模式</button><button id="bReset" type="button" class="plain">重新開始</button><button id="bHelp" type="button" class="plain">操作說明</button></div>
    </div>
    <div id="quest" class="phys quest" hidden></div>
    <div id="phys" class="phys" hidden></div>
    <div id="minds" class="phys minds" hidden></div>
  </div>
  <div class="acts"><output id="speed" class="speed" hidden>0 km/h</output><div id="bag" class="bag"></div><div id="acts" class="actcol"></div></div>
  <div id="talk" class="talk" hidden></div>
  <div id="map" class="map" hidden><canvas id="mapc" width="416" height="280" aria-label="街道地圖"></canvas></div>
  <div class="hint" id="hint"></div>
</div>
<button id="bPhotoEnd" type="button" class="photoend" hidden>結束拍照</button>
<div id="err" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const canvas=$('view');
const isTouch=matchMedia('(pointer:coarse)').matches;
$('hint').innerHTML=isTouch
  ? '<b>左手</b>拖：走路　<b>右手</b>拖：轉頭　<b>點</b>門：開門　<b>點</b>球：踢　<b>點</b>人：打招呼　右下角的按鈕：跳、撿、坐、開車、騎車、手電筒、雨傘、地圖'
  : '<b>點畫面</b>鎖定滑鼠　<b>W A S D</b> 走路　<b>Shift</b> 跑　<b>空白鍵</b> 跳　<b>E</b> 撿起／放下　<b>F</b> 上下車　<b>Q</b> 坐下　<b>1</b> 手電筒　<b>2</b> 雨傘　<b>M</b> 地圖　<b>V</b> 換視角　<b>點人</b>：說話　<b>點</b>門、球、人　<b>Esc</b> 放開滑鼠';
function fail(msg){$('err').hidden=false;$('err').textContent=msg;}
if(!window.THREE){fail('3D 引擎沒有載入成功，請重新整理一次。');return;}

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){fail('這個裝置或瀏覽器沒有開 WebGL，所以畫不出 3D 房間。');return;}
let pr=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(pr);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

// Safety net for every material: a single broken pixel (not-a-number, or brighter than the picture format can hold)
// would spread through the blur passes and turn the whole reflection black. So: broken becomes 0, too bright is capped.
THREE.ShaderChunk.output_fragment+='\nif(!(gl_FragColor.r>=0.0&&gl_FragColor.g>=0.0&&gl_FragColor.b>=0.0))gl_FragColor.rgb=vec3(0.0);\ngl_FragColor.rgb=min(gl_FragColor.rgb,vec3(64.0));\n';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05030a);
const camera=new THREE.PerspectiveCamera(68,1,0.08,800);
camera.rotation.order='YXZ';scene.add(camera);                           // in the scene so things can be held in front of it
// the help line shows for a while, then gets out of the way; "操作說明" in the settings brings it back
let hintTimer=0;function showHint(){$('hint').hidden=false;clearTimeout(hintTimer);hintTimer=setTimeout(()=>{$('hint').hidden=true;},14000);}
showHint();$('bHelp').onclick=showHint;
$('bSet').onclick=()=>{const p=$('panel');p.hidden=!p.hidden;$('bSet').setAttribute('aria-expanded',!p.hidden);};

/* ---------- procedural textures ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,srgb,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(srgb)t.encoding=THREE.sRGBEncoding;t.repeat.set(rx||1,ry||rx||1);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}

function woodTextures(){
  const S=1024,c=cv(S,S),b=cv(S,S),g=c.getContext('2d'),h=b.getContext('2d');
  h.fillStyle='#909090';h.fillRect(0,0,S,S);
  const rows=16,rh=S/rows;
  for(let r=0;r<rows;r++){
    let x=-rnd(0,400);
    while(x<S){
      const len=rnd(300,620),L=rnd(23,32),hue=rnd(24,31);
      g.fillStyle=`hsl(${hue},${rnd(28,38)}%,${L}%)`;g.fillRect(x,r*rh,len,rh);
      for(let i=0;i<46;i++){
        const y=r*rh+rnd(1,rh-1),a=rnd(.03,.11),dark=Math.random()<.6;
        g.strokeStyle=dark?`rgba(40,18,6,${a})`:`rgba(255,210,160,${a})`;g.lineWidth=rnd(.5,1.8);
        g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+len*.3,y+rnd(-3,3),x+len*.7,y+rnd(-3,3),x+len,y+rnd(-2,2));g.stroke();
        h.strokeStyle=`rgba(${dark?60:190},${dark?60:190},${dark?60:190},.08)`;h.lineWidth=1;
        h.beginPath();h.moveTo(x,y);h.lineTo(x+len,y);h.stroke();
      }
      g.fillStyle='rgba(15,6,2,.75)';g.fillRect(x+len-1.5,r*rh,3,rh);
      h.fillStyle='#1a1a1a';h.fillRect(x+len-1.5,r*rh,3,rh);
      x+=len;
    }
    g.fillStyle='rgba(15,6,2,.8)';g.fillRect(0,r*rh-1,S,2.5);
    h.fillStyle='#1a1a1a';h.fillRect(0,r*rh-1,S,2.5);
  }
  return [tex(c,true,.5),tex(b,false,.5)];
}
function noiseBump(size,dots,r0,r1,rep){
  const c=cv(size,size),g=c.getContext('2d');g.fillStyle='#808080';g.fillRect(0,0,size,size);
  for(let i=0;i<dots;i++){const v=Math.random()<.5?40:215;g.fillStyle=`rgba(${v},${v},${v},${rnd(.04,.14)})`;
    g.beginPath();g.arc(rnd(0,size),rnd(0,size),rnd(r0,r1),0,7);g.fill();}
  return tex(c,false,rep);
}
function weaveBump(rep){
  const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#777';g.fillRect(0,0,128,128);
  for(let i=0;i<128;i+=4){g.fillStyle=`rgba(255,255,255,${rnd(.15,.4)})`;g.fillRect(i,0,2,128);
    g.fillStyle=`rgba(0,0,0,${rnd(.15,.4)})`;g.fillRect(0,i,128,2);}
  return tex(c,false,rep);
}
function rugTexture(){
  const c=cv(512,640),g=c.getContext('2d');
  g.fillStyle='#d9c9b0';g.fillRect(0,0,512,640);
  const cols=['#b5533a','#1f5a5e','#e0a45c','#3b2a3f'];
  for(let i=0;i<5;i++){g.strokeStyle=cols[i%4];g.lineWidth=i===0?26:9;const m=24+i*34;g.strokeRect(m,m,512-2*m,640-2*m);}
  for(let i=0;i<7;i++){g.fillStyle=cols[i%4];g.save();g.translate(256,150+i*57);g.rotate(Math.PI/4);g.fillRect(-18,-18,36,36);g.restore();}
  for(let i=0;i<9000;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:240},200,.05)`;g.fillRect(rnd(0,512),rnd(0,640),2,2);}
  const t=tex(c,true);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
function artTexture(seed){
  const c=cv(384,512),g=c.getContext('2d');
  const P=seed?['#f3e6d3','#e8527a','#1f5a5e','#ffb347','#2a1b5e']:['#f1e4cf','#1f5a5e','#ff9a4d','#3b2a3f','#e8527a'];
  g.fillStyle=P[0];g.fillRect(0,0,384,512);
  if(seed){g.fillStyle=P[3];g.beginPath();g.arc(192,230,120,Math.PI,0);g.fill();
    for(let i=0;i<6;i++){g.fillStyle=P[1+i%4];g.fillRect(40,250+i*36,304,18-i*2);}}
  else{g.fillStyle=P[1];g.fillRect(40,60,150,390);g.fillStyle=P[2];g.beginPath();g.arc(230,200,95,0,7);g.fill();
    g.fillStyle=P[3];g.fillRect(170,330,170,120);g.strokeStyle=P[4];g.lineWidth=7;g.beginPath();g.moveTo(40,470);g.lineTo(344,90);g.stroke();}
  const t=tex(c,true);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
// far-away city for the horizon: one picture of plain shapes (tinted by the time of day), one of only the lit windows
function ringTextures(){
  const W=2048,H=256,a=cv(W,H),b=cv(W,H),g=a.getContext('2d'),w=b.getContext('2d');
  g.fillStyle='#fff';
  g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=16)g.lineTo(x,H-34-Math.sin(x/W*Math.PI*6)*14-Math.sin(x/W*Math.PI*22)*6);g.lineTo(W,H);g.fill();   // low hills
  let x=0;while(x<W-30){const bw=Math.min(rnd(40,110),W-x),bh=Math.random()<.12?rnd(150,230):rnd(45,125);g.fillRect(x,H-bh,bw,bh);
    for(let y=H-bh+8;y<H-44;y+=11)for(let k=x+6;k<x+bw-7;k+=10)if(Math.random()<.42){
      w.fillStyle=Math.random()<.2?'#7fe9ff':(Math.random()<.2?'#ff7ac0':'#ffd98a');w.fillRect(k,y,4,5);}
    x+=bw+rnd(0,26);}
  return[a,b].map(c=>{const t=tex(c,true,4,1);t.wrapT=THREE.ClampToEdgeWrapping;return t;});
}
// a flat colour with fine speckles: grass, asphalt, sand
function speckle(base,dots,strength,lines){
  const S=256,c=cv(S,S),g=c.getContext('2d');g.fillStyle=base;g.fillRect(0,0,S,S);
  for(let i=0;i<dots;i++){const v=Math.random()<.5?0:255;g.fillStyle=`rgba(${v},${v},${v},${rnd(.02,strength)})`;g.fillRect(rnd(0,S),rnd(0,S),rnd(1,4),rnd(1,4));}
  if(lines){g.strokeStyle='rgba(40,36,32,.55)';g.lineWidth=3;g.strokeRect(0,0,S,S);}                 // paving joints
  return tex(c,true,1);
}
function plateTexture(no){const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#20242c';g.fillRect(0,0,128,128);g.strokeStyle='#d9c08a';g.lineWidth=6;g.strokeRect(6,6,116,116);
  g.fillStyle='#f6ecd8';g.font='bold 84px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(no),64,70);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}

/* ---------- materials ---------- */
const [woodMap,woodBump]=woodTextures();

// make the real houses: one copy of the template per lot, moved (and turned around if flip is set)
// A lot can turn its house in quarter turns (turn: 0-3; flip:true is the same as turn:2), so houses can face any street.

function inWorld(x,z,m){return inTown(x,z,m)||(x>EB.x0+m&&x<EB.x1-m&&z>EB.z0+m&&z<EB.z1-m);}

// Lists the rest of the game reads. Furniture fills them in when it is placed.
const colliders=[];          // floor areas you cannot walk through   [x0,x1,z0,z1]
const pboxes=[];             // shapes balls bounce off               [x0,x1,y0,y1,z0,z1]
const interact=[];           // things you can click
const ACT={};                // places a person can do something, by name (tv1, tv2, sleep1, read1 ...)

const doors=[];              // doors that swing: each knows where it blocks when shut and when open

function scaleUV(g,w,h,d){const uv=g.attributes.uv,dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let i=0;i<uv.count;i++){const f=dm[Math.floor(i/4)];uv.setXY(i,uv.getX(i)*f[0],uv.getY(i)*f[1]);}}

function box(w,h,d,mat,x,y,z,o){o=o||{};

// Many small boxes drawn as ONE thing (books on a shelf, goods on a rack). Each entry: [w,h,d, x,y,z, colour, lean].
// Drawing a hundred separate books costs a hundred times more than drawing them as one batch.
const unitBox=new THREE.BoxGeometry(1,1,1),batchMat=new THREE.MeshStandardMaterial({roughness:.7});

// Weld everything in a group that never moves and shares a material into one piece per material.
// A house shell is about 110 separate boxes; after this it is about a dozen pieces, which is far quicker to draw.
// Left alone: anything you can click, anything inside a part marked dyn (door leaves, things you can pick up), and batches.
function weldStatic(group){
  group.updateMatrixWorld(true);const inv=new THREE.Matrix4().copy(group.matrixWorld).invert(),m4=new THREE.Matrix4(),by=new Map(),list=[];
  const moving=o=>{for(let p=o;p&&p!==group;p=p.parent)if(p.userData.dyn)return true;return false;};
  group.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh&&!o.userData.act&&o.visible&&o.material.visible!==false&&o.geometry.attributes.uv&&o.geometry.attributes.normal&&!moving(o))list.push(o);});
  for(const o of list){const k=o.material.uuid+(o.castShadow?'c':'')+(o.receiveShadow?'r':'');if(!by.has(k))by.set(k,[]);by.get(k).push(o);}
  for(const arr of by.values()){if(arr.length<2)continue;let n=0;
    const gs=arr.map(o=>{const q=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();q.applyMatrix4(m4.multiplyMatrices(inv,o.matrixWorld));n+=q.attributes.position.count;return q;});

// A prefab builds one piece of furniture around its own middle and returns a description of itself:
//   solid: [x0,x1,z0,z1]         where you cannot walk
//   boxes: [x0,x1,y0,y1,z0,z1]   what balls hit
//   spots: {type, ap:[x,z], an:[x,y,z], yaw, pose, label ...}   how a person uses it
// place() puts it in the room, turns it, and moves all of those numbers along with it.
const PREFAB={},spotCount={};let furnSeq=0;

  new THREE.Vector3(-1,0,0),new THREE.Vector3(0,0,1),new THREE.Vector3(0,1,0)));   // lying on your back, head toward +z
// makeFrame(): a group sitting at (ox,oz), turned by rot, plus the maths to carry points and areas along with it

// One wall, built in its own frame: u runs along the wall, the inside of the room is toward +z, the wall itself sits at z < 0.
// Holes (windows, doors) are cut by building the wall in pieces around them.
function buildWall(R,side,def){
  const T=WALL_T,H=R.house,horiz=side==='north'||side==='south',L=horiz?R.w:R.d,W=R.walls;
  const rot={north:0,south:Math.PI,east:-Math.PI/2,west:Math.PI/2}[side],sign=(side==='north'||side==='east')?1:-1;
  const ox=R.cx+(side==='east'?R.w/2:side==='west'?-R.w/2:0),oz=R.cz+(side==='south'?R.d/2:side==='north'?-R.d/2:0);
  const F=makeFrame(ox,oz,rot),prev=cur;cur=F.g;
  // long walls cover the corners, but only where a side wall actually meets them
  const lo=side==='north'?'west':'east',hi=side==='north'?'east':'west';
  const u0=-L/2-(horiz&&W[lo]?T:0),u1=L/2+(horiz&&W[hi]?T:0),mat=hmat(H,def.mat),ext=hmat(H,'ext');
  const piece=(a,b,y0,y1)=>{if(b-a<.01||y1-y0<.01)return;
    box(b-a,y1-y0,T,mat,(a+b)/2,(y0+y1)/2,-T/2);
    if(!def.inner)box(b-a+(horiz?.06:0),y1-y0,.03,ext,(a+b)/2,(y0+y1)/2,-T-.015);              // outside skin in the house colour
    const s=F.span(a,b,-T,0);pboxes.push([s[0],s[1],y0,y1,s[2],s[3]]);
    if(y0<1){colliders.push(s);if(y0===0)box(b-a,.1,.02,M.trim,(a+b)/2,.05,.01);}};          // reaches the floor: you cannot walk through it
  if(!horiz&&!def.inner)[-1,1].forEach(k=>box(T+.03,RH,.03,ext,k*(L/2+(T+.03)/2),RH/2,-T-.015));   // skin around the corners
  const holes=(def.open||[]).map(o=>Object.assign({},o,{u:o.c*sign})).sort((a,b)=>a.u-b.u);
  let u=u0;
  for(const o of holes){const a=o.u-o.half,b=o.u+o.half,y0=o.y0||0,y1=o.y1;
    piece(u,a,0,RH);piece(a,b,0,y0);piece(a,b,y1,RH);u=b;

      [y0+.03,y1-.03].forEach(y=>box(2*WX,.05,.06,M.black,o.u,y,-T/2));
      box(2*WX,y1-y0,.012,M.glass,o.u,ym,-T/2,{shadow:false}).receiveShadow=false;
      const s=F.span(a,b,-T/2-.01,-T/2+.01);pboxes.push([s[0],s[1],y0,y1,s[2],s[3]]);         // balls bounce off the glass
      [-1,1].forEach(k=>{for(let i=0;i<5;i++)box(.1,y1+.05,.07,M.linen,o.u+k*(WX+.08+i*.085),(y1+.15)/2,.1+(i%2)*.035,{r:.03});});   // curtains
      box(2*WX+1.1,.03,.03,M.brass,o.u,y1+.1,.1);
    }else{                                                                                    // door: a wooden frame, and a leaf on hinges
      [a-.03,b+.03].forEach(x=>box(.06,y1+.06,T+.1,M.walnut,x,(y1+.06)/2,-T/2));
      box(b-a+.12,.06,T+.1,M.walnut,o.u,y1+.03,-T/2);
      const w=b-a-.02,hinge=new THREE.Group();hinge.userData.dyn=true;hinge.position.set(b-.01,0,-T/2);cur.add(hinge);   // hinges on the +u side; it swings away from this room
      const pv=cur;cur=hinge;
      const leaf=box(w,y1-.02,.04,o.front?hmat(H,'doorLeaf'):M.trim,-w/2,(y1-.02)/2+.01,0,{r:.008});
      [-1,1].forEach(k=>{box(.13,.022,.022,M.brass,-w+.11,1.0,k*.05);box(.022,.022,.05,M.brass,-w+.055,1.0,k*.035);});   // handles
      cur=pv;
      const shut=F.span(a,b,-T,0),open=F.span(b-.05,b,-T/2-w,-T/2),mid=F.pt(o.u,-T/2);
      const D={hinge,t:0,open:false,user:false,shut,openC:open,x:mid[0],z:mid[1],y1,pb:[shut[0],shut[1],0,y1,shut[2],shut[3]]};

        const pl=new THREE.Mesh(new THREE.PlaneGeometry(.26,.26),new THREE.MeshBasicMaterial({map:plateTexture(H.no)}));

// doors: you click them; people open them as they walk up and shut them behind themselves
function doorArea(d){return d.open?d.openC:d.shut;}
function updateDoors(dt){
  for(const d of doors){
    let walker=false,inWay=Math.hypot(pos.x-d.x,pos.z-d.z)<.85;                 // never shut a door on someone standing in it
    for(const n of people){if(n.hidden)continue;const dist=Math.hypot(n.pos.x-d.x,n.pos.z-d.z);
      if(dist<.85)inWay=true;if(dist<1.35&&n.phase==='go'&&n.path.length)walker=true;}
    const want=(d.user||walker||(inWay&&d.t>.5))?1:0;
    if(want===d.t)continue;
    d.t=Math.max(0,Math.min(1,d.t+Math.sign(want-d.t)*dt*2.6));
    const e=d.t*d.t*(3-2*d.t);d.hinge.rotation.y=-e*Math.PI/2;
    const nowOpen=d.t>.5;
    if(nowOpen!==d.open){d.open=nowOpen;sfxDoor(d.x,d.z);const c=doorArea(d);d.pb[0]=c[0];d.pb[1]=c[1];d.pb[4]=c[2];d.pb[5]=c[3];}   // balls hit the leaf where it is now
  }
}

    if(c===onBus&&c.dir!==0&&c.x*c.busDir>76){busTurn(c);continue;}                    // with you aboard the bus turns back just outside town
    let tp=c.route[c.wi],dist=Math.hypot(tp[0]-c.x,tp[1]-c.z);
    if(dist<1.6+c.v*.12){c.wi++;if(c.wi>=c.route.length){

      if(c.bus){c.busDir=c.home;c.stopX=BUS_STOP[c.home];}
      c.on=false;c.g.visible=false;c.tag.hidden=true;c.t=c.taxi?1e9:c.bus?rnd(14,26):rnd(4,14)*(1+dark*1.5);continue;}tp=c.route[c.wi];}
    const turn=angDiff(Math.atan2(-(tp[1]-c.z),tp[0]-c.x),c.h),maxT=(c.v/3.3+.05)*dt;c.h+=Math.max(-maxT,Math.min(maxT,turn));

    if(ride){const rx=Math.cos(ride.h),rz=-Math.sin(ride.h);for(const k of[-1,0,1])see(ride.x+rx*k*ride.S.len,ride.z+rz*k*ride.S.len,1.6);}

    for(const d of pets)if(onAnyRoad(d.x,d.z))see(d.x,d.z,3.3);                        // drivers stop for the dog too

    if(c.bus||c.taxi){const d=(c.stopX-px0)*c.busDir;                                          // a bus pulls up at its stop, waits with the doors open, then goes on

    if(Math.abs(turn)>.2)want=Math.min(want,3.6);                                      // slow down for corners

    c.honk-=dt;

    c.box[0]=c.x-hx;c.box[1]=c.x+hx;c.box[2]=c.z-hz;c.box[3]=c.z+hz;

  }
}

/* ---------- weather ---------- */
// Rain comes and goes by itself, or you press the button. When it starts, people outside get a fright,
// give up whatever they were doing out there, and hurry home.
let rainOn=false,rain=0,rainT=rnd(150,300);
let wx='sun',storm=false,fogOn=false,mist=0,flash=0,flash2=0,boltT=5,boltShow=0,toldBolt=false;   // weather: sun, rain, storm (rain with lightning) or fog
const RN=900,rPos=new Float32Array(RN*6);                                   // each drop is a short streak: two points
for(let i=0;i<RN;i++){const x=rnd(-16,16),y=rnd(0,12),z=rnd(-16,16);rPos.set([x,y,z,x+.03,y+.45,z],i*6);}
const rGeo=new THREE.BufferGeometry();rGeo.setAttribute('position',new THREE.BufferAttribute(rPos,3));
const rainPts=new THREE.LineSegments(rGeo,new THREE.LineBasicMaterial({color:0xbfd4e6,transparent:true,opacity:.4,depthWrite:false,fog:false}));
rainPts.frustumCulled=false;rainPts.visible=false;scene.add(rainPts);
// a lightning bolt: a crooked bright line far away in the sky
const boltGeo=new THREE.BufferGeometry();boltGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(12*3),3));
const bolt=new THREE.Line(boltGeo,new THREE.LineBasicMaterial({color:new THREE.Color(9,10,14),fog:false}));bolt.frustumCulled=false;bolt.visible=false;scene.add(bolt);
function strike(){
  const a=rnd(0,6.283),d=rnd(90,220),A=boltGeo.attributes.position;let x=pos.x+Math.cos(a)*d,z=pos.z+Math.sin(a)*d;
  for(let i=0;i<12;i++){A.setXYZ(i,x,90-i*8.2,z);x+=rnd(-7,7);z+=rnd(-7,7);}A.needsUpdate=true;
  bolt.visible=true;boltShow=.22;flash=1;flash2=.13;
  const wait=d/343*4;setTimeout(()=>sfxThunder(1-d/300),wait*1000);                 // light arrives at once; sound takes its time (stretched a little so you can notice)
  if(!toldBolt){toldBolt=true;say('閃電！光跑得非常快，所以先看到亮光；聲音跑得慢，過一下才聽到轟隆隆的雷聲。');}
  for(const n of people)if(!n.hidden&&!n.react&&!n.lie&&!roomAt(n.pos.x,n.pos.z)&&Math.random()<.6)react(n,'哇！打雷了！',1.2,'startle');
  for(const d2 of pets){d2.happy=0;bark(d2);}
}
const WX={sun:'晴天',rain:'下雨',storm:'雷雨',fog:'起霧'};
function setWeather(k){if(k===wx)return;const was=wx;wx=k;storm=k==='storm';fogOn=k==='fog';toldBolt=false;boltT=rnd(3,6);
  $('bRain').textContent='天氣：'+WX[k];rainT=rnd(120,260);
  const wet=k==='rain'||k==='storm';
  if(wet!==rainOn){rainOn=wet;if(wet)for(const n of people)if(!n.hidden&&!roomAt(n.pos.x,n.pos.z))notify(n,'rain');}
  say(k==='rain'?'下雨了：在外面的人會嚇一跳，放下手邊的事，跑回家。':k==='storm'?'雷雨來了：雨很大，天空還會閃電打雷。':k==='fog'?'起霧了：空氣裡有很多很小的水滴，遠的東西變得白白的看不清楚。':was==='fog'?'霧散了。':'雨停了。');}
function setRain(on){setWeather(on?'rain':'sun');}
$('bRain').onclick=()=>setWeather({sun:'rain',rain:'storm',storm:'fog',fog:'sun'}[wx]);
function updateWeather(dt){
  rainT-=dt;if(rainT<=0){const r=Math.random(),early=clock>4&&clock<9;setWeather(wx!=='sun'?(wx==='rain'&&r<.3?'storm':'sun'):r<(early?.45:.12)?'fog':r<.6?'rain':r<.75?'storm':'sun');}
  mist+=((fogOn?1:0)-mist)*(1-Math.exp(-dt*.5));
  flash*=Math.exp(-dt*10);if(flash2>0){flash2-=dt;if(flash2<=0)flash=.8;}          // a flash flickers twice
  if(boltShow>0){boltShow-=dt;if(boltShow<=0)bolt.visible=false;}
  if(storm&&rain>.5){boltT-=dt;if(boltT<=0){boltT=rnd(7,18);strike();}}
  rain+=((rainOn?1:0)-rain)*(1-Math.exp(-dt*.8));
  M.asphalt.roughness=.85-.5*rain;M.concrete.roughness=.9-.4*rain;               // wet ground shines
  rainPts.visible=rain>.03;if(!rainPts.visible)return;
  rainPts.material.opacity=.4*rain;rainPts.position.set(pos.x,0,pos.z);
  for(let i=0;i<RN;i++){const k=i*6;let x=rPos[k],y=rPos[k+1]-15*dt,z=rPos[k+2];
    if(y<0||(use.umbrella&&!ride&&y<2.4&&Math.hypot(x,z)<1.15)||(y<RH+.3&&roomAt(pos.x+x,pos.z+z))){x=rnd(-16,16);y=rnd(8,12);z=rnd(-16,16);}   // your umbrella and the roofs keep the rain out
    rPos[k]=x;rPos[k+1]=y;rPos[k+2]=z;rPos[k+3]=x+.03;rPos[k+4]=y+.45;rPos[k+5]=z;}
  rGeo.attributes.position.needsUpdate=true;

/* ---------- things you can do: jump, carry and throw, sit, ride, use items ---------- */
// The buttons at the bottom right change with what is possible right now, so you never have to remember a key.

// --- jumping ---

// --- the sea ---

// --- things you keep in your bag and use ---

function showItems(){torch.intensity=use.flashlight&&!ride?1.7:0;handTorch.visible=use.flashlight&&!ride;handBrolly.visible=use.umbrella&&!ride;$('map').hidden=!use.phone;actKey='';}

// the phone map: the whole street from above

// --- carrying and throwing ---
function nearBall(){let best=null,bd=1.7;for(const b of bodies){if(b.held)continue;const d=Math.hypot(b.p.x-pos.x,b.p.z-pos.z);if(d<bd&&b.p.y<2){bd=d;best=b;}}return best;}

  held.p.set(camera.position.x+camDir.x*.55,camera.position.y-.32+camDir.y*.4,camera.position.z+camDir.z*.55);held.v.set(vel.x,0,vel.z);held.mesh.position.copy(held.p);}

// --- sitting ---

    const d=Math.min(Math.hypot(A.ap[0]-pos.x,A.ap[1]-pos.z),Math.hypot(A.an[0]-pos.x,A.an[2]-pos.z));if(d<bd){bd=d;best=k;}}

const nearSeat=()=>nearSpot('sit'),nearBed=()=>nearSpot('lie');
function sitDown(){const k=nearSeat();if(!k)return;seat={k,A:ACT[k]};vel.x=vel.z=0;yaw=seat.A.yaw+Math.PI;pitch=-.05;}   // face the way the seat faces

  pos.x=seat.A.ap[0];pos.z=seat.A.ap[1];seat=null;}

// --- riding: a car and a bicycle ---

    for(const d of doors){const c=doorArea(d);if(cx>c[0]-R&&cx<c[1]+R&&cz>c[2]-R&&cz<c[3]+R)return true;}
    for(const c of cars)if(c.on&&cx>c.box[0]-R&&cx<c.box[1]+R&&cz>c.box[2]-R&&cz<c.box[3]+R)return true;

// Every sound is made on the spot from simple tones and hiss, so there are no sound files to load.
// Browsers only allow sound after you click or press a key, so it starts then.
let AC=null,master=null,soundOn=true,noiseBuf=null,rainG=null,engO=null,engG=null,stepNo=0,lastBounce=0;
function audioStart(){
  if(AC||!soundOn)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  try{AC=new A();}catch(e){return;}
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=noiseBuf;src.loop=true;                               // rain: hiss that never stops, turned up when it rains
  const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=1700;rainG=AC.createGain();rainG.gain.value=0;src.connect(hp);hp.connect(rainG);rainG.connect(master);src.start();
  engO=AC.createOscillator();engO.type='sawtooth';engO.frequency.value=50;                           // engine: a low buzz whose pitch follows the speed
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=320;engG=AC.createGain();engG.gain.value=0;engO.connect(lp);lp.connect(engG);engG.connect(master);engO.start();
}
addEventListener('pointerdown',audioStart);addEventListener('keydown',audioStart);
function noise(dur,freq,q,vol){if(!AC||!soundOn||vol<=.002)return;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;const g=AC.createGain(),t=AC.currentTime;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.5,dur+.03);}
function tone(freq,dur,vol,type,slide){if(!AC||!soundOn||vol<=.002)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);}
const hear=(x,z,far)=>Math.max(0,1-Math.hypot(x-pos.x,z-pos.z)/far);                                  // 1 right next to you, 0 too far to hear
function sfxBounce(b,J){const now=performance.now();if(now-lastBounce<60)return;const v=Math.min(1,J/b.m/6)*hear(b.p.x,b.p.z,14);if(v<=.02)return;lastBounce=now;
  tone(b.m>3?70:b.kind==='tennis'?420:b.kind==='beach'?240:160,.12,v*.5,'sine',.6);noise(.05,b.m>3?200:900,1,v*.3);}   // heavy balls thud, light ones pop
function sfxStep(){if(waterDepth()>.05){noise(.16,900,.6,.12);return;}noise(.06,roomAt(pos.x,pos.z)?520:300,1.2,.1);}   // splashing in the sea
function sfxHonk(x,z){const v=.22*hear(x,z,45);tone(392,.4,v,'square');tone(494,.4,v,'square');}
function sfxDoor(x,z){noise(.14,240,2,.3*hear(x,z,10));}
function sfxCoin(){tone(880,.08,.2,'triangle');setTimeout(()=>tone(1320,.16,.2,'triangle'),80);}
function sfxBell(){tone(1568,.5,.18,'sine');setTimeout(()=>tone(1245,.7,.16,'sine'),180);}
function sfxThunder(k){const v=Math.max(.15,k)*(roomAt(pos.x,pos.z)?.5:1);noise(2.6,110,.6,.7*v);noise(1.2,400,.5,.25*v);tone(48,2.2,.35*v,'sine',.6);}
function sfxBump(){noise(.18,140,.8,.4);tone(60,.2,.3,'sine',.5);}
function updateAudio(){
  if(!AC)return;const t=AC.currentTime;
  rainG.gain.setTargetAtTime(soundOn?rain*(roomAt(pos.x,pos.z)?.04:.15):0,t,.3);                     // quieter indoors
  let ev=0,ef=50;
  if(ride&&ride.kind!=='bike'){const m=ride.kind==='moto'?1.8:1;ev=.04+Math.min(.07,Math.abs(ride.v)*.006);ef=(48+Math.abs(ride.v)*11)*m;}   // a motorbike buzzes higher than a car
  else{let best=30,bc=null;for(const c of cars)if(c.on){const d=Math.hypot(c.x-pos.x,c.z-pos.z);if(d<best){best=d;bc=c;}}
    if(bc){ev=.055*(1-best/30)*(roomAt(pos.x,pos.z)?.3:1);ef=50+bc.v*9;}}                             // the nearest passing car
  engG.gain.setTargetAtTime(soundOn?ev:0,t,.12);engO.frequency.setTargetAtTime(ef,t,.12);
}
$('bSound').onclick=()=>{soundOn=!soundOn;$('bSound').textContent='聲音：'+(soundOn?'開':'關');if(soundOn)audioStart();};

/* ---------- music ---------- */
// A tiny band that plays itself. Each scene has its own tune, written as chords and patterns of 16 steps per bar.
// The tunes are made up for this game. When you walk into a different scene the old tune fades out and the new one fades in.
let musicOn=true,musBus=null,trkGain=null,trkName='',wantName='',wantSince=0,nextT=0,stepNo16=0;
const hz=n=>440*Math.pow(2,(n-69)/12);                                       // note number -> pitch
const CHORD={maj:[0,4,7],min:[0,3,7],maj7:[0,4,7,11],m7:[0,3,7,10],dom7:[0,4,7,10],m9:[0,3,7,10,14],sus:[0,5,7]};
const pat=s=>s.replace(/ /g,'').split('').map(c=>c==='.'?0:parseInt(c,36));    // '1..2' -> [1,0,0,2]
// prog: [root note, chord] per bar. bass: 1 = root, 2 = fifth. arp: which note of the chord (1,2,3… then up an octave).
const TRACKS={
  home:{name:'在家',bpm:72,swing:.16,prog:[[53,'maj7'],[52,'m7'],[50,'m7'],[48,'maj7']],pad:.045,padType:'triangle',cut:1300,
    bass:pat('1.....1. ..1.....'),arp:pat('..3.2.4. .3.2..5.'),arpVol:.05,arpType:'triangle',arpLen:.5,kick:pat('1.......1.1.....'),snare:pat('....1.......1...'),hat:pat('1.1.1.1.1.1.1.11'),drum:.45},
  day:{name:'白天的街',bpm:104,swing:.05,prog:[[48,'maj'],[55,'maj'],[57,'min'],[53,'maj']],pad:.03,padType:'triangle',cut:2200,
    bass:pat('1...1...1...1.2.'),arp:pat('1.3.5.3.4.3.2.3.'),arpVol:.045,arpType:'triangle',arpLen:.22,kick:pat('1.......1.......'),snare:pat('....1.......1...'),hat:pat('..1...1...1...1.'),drum:.4},
  dusk:{name:'黃昏',bpm:92,swing:0,prog:[[57,'min'],[53,'maj7'],[48,'maj'],[55,'maj']],pad:.05,padType:'sawtooth',cut:1500,
    bass:pat('1.1.1.1.1.1.1.2.'),arp:pat('1234 5432 1234 5654'),arpVol:.032,arpType:'square',arpLen:.16,kick:pat('1...1...1...1...'),snare:pat('....1.......1...'),hat:pat('1.1.1.1.1.1.1.1.'),drum:.5},
  night:{name:'深夜',bpm:58,swing:0,prog:[[50,'m9'],[46,'maj7'],[43,'m9'],[45,'sus']],pad:.06,padType:'sine',cut:900,
    bass:pat('1...............'),arp:pat('....5.......3...'),arpVol:.05,arpType:'sine',arpLen:1.6,kick:pat('................'),snare:pat('................'),hat:pat('................'),drum:0},
  rain:{name:'下雨天',bpm:66,swing:.1,prog:[[52,'m7'],[48,'maj7'],[55,'maj'],[50,'sus']],pad:.045,padType:'sine',cut:1100,
    bass:pat('1.......2.......'),arp:pat('1...3...2...5.4.'),arpVol:.06,arpType:'triangle',arpLen:.9,kick:pat('................'),snare:pat('................'),hat:pat('....1.......1...'),drum:.2},
  drive:{name:'兜風',bpm:118,swing:0,prog:[[52,'min'],[48,'maj'],[55,'maj'],[50,'maj']],pad:.035,padType:'sawtooth',cut:1800,
    bass:pat('1.1.1.1.1.1.2.1.'),arp:pat('5..5..4. 5..7..5.'),arpVol:.045,arpType:'sawtooth',arpLen:.2,kick:pat('1...1...1...1...'),snare:pat('....1.......1..1'),hat:pat('..1...1...1...1.'),drum:.6},
  shop:{name:'商店裡',bpm:96,swing:.12,prog:[[50,'m7'],[55,'dom7'],[48,'maj7'],[57,'dom7']],pad:0,padType:'triangle',cut:2000,
    bass:pat('1.....2.1...2...'),arp:pat('..C..C....C..C..'),arpVol:.035,arpType:'triangle',arpLen:.14,kick:pat('1.....1...1.....'),snare:pat('....1..1....1...'),hat:pat('1.1.1.1.1.1.1.1.'),drum:.3},
  beach:{name:'海邊',bpm:80,swing:.1,prog:[[48,'maj7'],[45,'m7'],[53,'maj7'],[55,'sus']],pad:.05,padType:'sine',cut:1600,
    bass:pat('1.....2...1.....'),arp:pat('1.3.5.7.5.3.4.2.'),arpVol:.045,arpType:'sine',arpLen:.7,kick:pat('1.........1.....'),snare:pat('................'),hat:pat('..1...1...1...1.'),drum:.25},
  chase:{name:'被巡邏員追',bpm:140,swing:0,prog:[[50,'min'],[50,'min'],[46,'maj'],[45,'maj']],pad:.03,padType:'sawtooth',cut:1200,
    bass:pat('1.11.11.1.11.112'),arp:pat('5.4.5.7.5.4.3.2.'),arpVol:.04,arpType:'square',arpLen:.1,kick:pat('1...1...1...1...'),snare:pat('....1.......1.11'),hat:pat('1111111111111111'),drum:.6}
};
function mNote(f,t,dur,vol,type,att,cut){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(cut){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=cut;o.connect(lp);lp.connect(g);}else o.connect(g);
  g.connect(trkGain);o.start(t);o.stop(t+dur+.05);}
function mDrum(kind,t,vol){
  if(kind==='kick'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
    g.gain.setValueAtTime(vol*.5,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(trkGain);o.start(t);o.stop(t+.2);return;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter(),g=AC.createGain(),snare=kind==='snare';
  f.type=snare?'bandpass':'highpass';f.frequency.value=snare?1700:7000;g.gain.setValueAtTime(vol*(snare?.22:.07),t);g.gain.exponentialRampToValueAtTime(.0001,t+(snare?.14:.04));
  s.connect(f);f.connect(g);g.connect(trkGain);s.start(t,Math.random()*.5,.2);}
function playStep(T,n,t,d){
  const s=n%16,bar=Math.floor(n/16),ch=T.prog[bar%T.prog.length],root=ch[0],tones=CHORD[ch[1]];
  if(s===0&&T.pad)for(const k of tones){mNote(hz(root+k),t,d*16.5,T.pad,T.padType,.5,T.cut);if(T.padType==='sawtooth')mNote(hz(root+k)*1.006,t,d*16.5,T.pad*.7,T.padType,.5,T.cut);}   // a soft held chord
  if(T.bass[s])mNote(hz(root-12+(T.bass[s]===2?7:0)),t,d*1.8,.17,'triangle',.01,500);
  const a=T.arp[s];
  if(a===12)for(const k of tones)mNote(hz(root+12+k),t,T.arpLen,T.arpVol,T.arpType,.005,T.cut);        // C = the whole chord as a short stab
  else if(a){const i=a-1,note=root+12+tones[i%tones.length]+12*Math.floor(i/tones.length)+(bar%4===3&&s>11?2:0);mNote(hz(note),t,T.arpLen,T.arpVol,T.arpType,.005,T.cut*1.6);}
  if(T.drum){if(T.kick[s])mDrum('kick',t,T.drum);if(T.snare[s])mDrum('snare',t,T.drum);if(T.hat[s])mDrum('hat',t,T.drum);}
}
// which tune fits where you are and what is going on
function musicScene(){
  if(heat>0)return'chase';
  if(ride&&ride.kind==='car')return RADIO[radioIdx];
  if(onBus)return'drive';
  const r=roomAt(pos.x,pos.z);
  if(r)return r.id==='shop'?'shop':'home';
  if(rain>.4)return'rain';
  if(pos.z<-3.5&&dark<.75)return'beach';
  if(dark>.75)return'night';
  return clock>=16.5&&clock<19.6||clock>=5&&clock<7?'dusk':'day';
}
function updateMusic(){
  if(!AC)return;const t=AC.currentTime;
  if(!musBus){musBus=AC.createGain();musBus.gain.value=.55;musBus.connect(master);}
  const want=musicOn&&soundOn?musicScene():'';
  if(want!==wantName){wantName=want;wantSince=t;}
  if(wantName!==trkName&&(t-wantSince>1.2||!trkName)){                       // stay in a scene a moment before the band changes tune
    if(trkGain){const old=trkGain;old.gain.setTargetAtTime(0,t,.5);setTimeout(()=>old.disconnect(),4000);}
    trkName=wantName;trkGain=null;
    if(trkName){trkGain=AC.createGain();trkGain.gain.setValueAtTime(.0001,t);trkGain.gain.setTargetAtTime(1,t+.3,.8);trkGain.connect(musBus);nextT=t+.4;stepNo16=0;}
    $('bMusic').textContent='音樂：'+(musicOn?'開'+(trkName?'（'+TRACKS[trkName].name+'）':''):'關');
  }
  if(!trkName)return;
  const T=TRACKS[trkName],d=60/T.bpm/4;
  if(nextT<t-.3)nextT=t+.05;                                                 // the tab was asleep: do not try to catch up
  while(nextT<t+.45){playStep(T,stepNo16,nextT+(stepNo16%2?T.swing*d:0),d);nextT+=d;stepNo16++;}
}
setInterval(updateMusic,110);
$('bMusic').onclick=()=>{musicOn=!musicOn;audioStart();wantSince=-9;$('bMusic').textContent='音樂：'+(musicOn?'開':'關');};

/* ---------- talking, favours, money ---------- */
// Click a person to talk. You can say hello, ask what they are doing, offer help (they may give you a job),
// or give them a drink. Jobs pay money; being kind raises your name on the street, being a nuisance lowers it.
let cash=60,rep=0,drinks=0,stam=1,quest=null,talkN=null;
// heat: how much trouble you are in right now (0 to 3 stars). Each time you hit or scare someone it goes up;
// the patrol officer then comes after you, faster the more stars you have. Stay out of trouble for a while and it fades.
let heat=0,heatAt=0,saveNo=0;
function addRep(d){rep=Math.max(-9,Math.min(20,rep+d));if(d<0){heat=Math.min(3,heat+1);heatAt=performance.now();say('有人看到了！巡邏員會來找你。'+'★'.repeat(heat));}}
function fine(n){const amt=Math.min(cash,25*heat),h=heat;heat=0;cash-=amt;sfxBump();
  showTalk(n,'請注意安全，不要嚇到別人。'+(amt?'這次罰你 $'+amt+'。':'這次先警告你。'),[['對不起，我會小心',closeTalk]]);
  say('你被巡邏員攔下來了（'+'★'.repeat(h)+'）'+(amt?'，罰了 $'+amt+'。':'。'));}
const SAVE_KEY='sunset-street-save-1';
function saveGame(){if(noSave)return;try{localStorage.setItem(SAVE_KEY,JSON.stringify({clock,cash,rep,drinks,stam,bag,x:pos.x,z:pos.z,yaw,rides:rides.map(r=>[r.x,r.z,r.h]),third,outfit,day,fishBag,likes:Object.fromEntries(people.map(n=>[n.o.name,n.like]))}));}catch(e){}}
function loadGame(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d||typeof d.cash!=='number')return false;
  clock=d.clock;cash=d.cash;rep=d.rep;drinks=d.drinks||0;stam=d.stam;Object.assign(bag,d.bag);pos.x=d.x;pos.z=d.z;yaw=d.yaw;
  for(const n of people)if(d.likes&&d.likes[n.o.name]!=null)n.like=d.likes[n.o.name];
  if(d.third)setView(true);if(d.outfit)wear(d.outfit);if(d.day)day=d.day;fishBag=d.fishBag||0;
  (d.rides||[]).forEach((q,i)=>{const r=rides[i];if(r){r.x=q[0];r.z=q[1];r.h=q[2];r.g.position.set(r.x,0,r.z);r.g.rotation.y=r.h;}});return true;}catch(e){return false;}}
let noSave=false;
$('bReset').onclick=()=>{noSave=true;try{localStorage.removeItem(SAVE_KEY);}catch(e){}try{location.reload();}catch(e){}};
function hudStats(){$('cash').textContent='$'+cash+'　名聲 '+(rep>0?'+':'')+rep+'　體力 '+Math.round(stam*100)+(heat?'　'+'★'.repeat(heat):'');
  if(heat&&performance.now()-heatAt>45000){heat--;heatAt=performance.now();}              // 45 quiet seconds take one star away
  if(++saveNo%40===0)saveGame();                                                          // the game saves itself every 10 seconds or so
  const q=$('quest');q.hidden=!quest;if(quest)q.textContent='任務：'+quest.text+'（做完給 $'+quest.reward+'）';
  rideQuest();parcelQuest();dogQuest();
  $('speed').hidden=!ride;if(ride)$('speed').textContent=Math.round(Math.abs(ride.v)*3.6)+' km/h';
  if(talkN&&(talkN.hidden||talkN.lie||Math.hypot(talkN.pos.x-pos.x,talkN.pos.z-pos.z)>4.2))closeTalk();}
// running uses up your breath; walking, and especially sitting, brings it back
let swimNote=0;
function moveSpeed(dt,want){const wd=waterDepth();
  if(wd>.05){const deep=wd>1;stam=Math.max(0,Math.min(1,stam+(deep&&want>.1?-.035:.03)*dt));               // swimming is tiring; floating still is not
    if(deep&&performance.now()-swimNote>30000){swimNote=performance.now();say('你在游泳。游泳很累，體力快沒了就回岸邊。');}
    if(deep&&stam<=0){vel.z+=2.2*dt;if(performance.now()-swimNote>4000){swimNote=performance.now();say('太累了，海浪把你慢慢推回岸邊。');}}
    return 1.9*(1-.5*Math.min(1,wd/1.3));}
  const run=(keys.ShiftLeft||keys.ShiftRight||runLock||Math.hypot(joy.x,joy.y)>.93)&&want>.1&&stam>0&&!ride&&!seat;
  stam=Math.max(0,Math.min(1,stam+(run?-.09:seat?.14:.05)*dt));return run?3.3:1.9;}
function buyDrink(){if(cash<20){say('飲料一罐 $20，你的錢不夠。幫鄰居做事可以賺錢。');return;}
  cash-=20;drinks++;sfxCoin();actKey='';say('你買了一罐飲料（剩 $'+cash+'）。按右下角「喝飲料」補體力，或在聊天時請別人喝。');}
function drinkUp(){if(!drinks)return;drinks--;stam=1;actKey='';say('咕嚕咕嚕。體力補滿了，可以繼續跑。');}
function describe(n){const g=n.goal,G=GOALS[g.id],pr=progress(n);
  let low='energy';for(const k in NEED_ZH)if(n.need[k]<n.need[low])low=k;
  const feel={food:'我肚子餓了。',energy:'我有點累了。',fun:'我好無聊。',fit:'我想動一動。',calm:'我想安靜一下。',care:'我還有家事沒做。'}[low];
  return(n.phase==='at'?'我在'+G.label+(pr>=0?'，做了 '+Math.round(pr*100)+'% 了。':'。'):'我正要去'+G.label+'。')+(n.need[low]<.35?feel:'其他都還好。');}
function offer(n){                                                          // think of something this person would like done
  const others=people.filter(m=>m!==n&&m.home>=0&&!m.hidden&&m.home!==n.home);     // only people with an address can get a letter
  if(others.length&&Math.random()<.3){const to=others[Math.floor(Math.random()*others.length)];
    return{type:'letter',from:n,to,reward:50,text:'把'+n.o.name+'的信拿給 '+houses[to.home].no+' 號的'+to.o.name,ask:'可以幫我把這封信拿給 '+houses[to.home].no+' 號的'+to.o.name+'嗎？'};}
  if(Math.random()<.5){const D=[['公園',19.5,11.3],['夕陽商店',36.5,11.3],['街的西邊',-30,7.8],['街的東邊',41,11.3]].filter(d=>Math.hypot(d[1]-n.pos.x,d[2]-n.pos.z)>14),d=D[Math.floor(Math.random()*D.length)];
    return{type:'ride',from:n,dest:d,reward:60,text:'開車載'+n.o.name+'去'+d[0]+'（他會走到你的黃色車旁邊等你，上車後他就會坐進來）',ask:'你有車對吧？可以載我去'+d[0]+'嗎？我走去你的車那邊等你。'};}
  const dg=pets[0];
  if(dg&&dg.owner===n&&!dg.carry&&dark<.7&&Math.random()<.7){const S=LOST_AT.filter(d=>!blocked(d[1],d[2])&&Math.hypot(d[1]-dg.home[0],d[2]-dg.home[1])>14),d=S[Math.floor(Math.random()*S.length)];
    if(d)return{type:'dog',from:n,at:d,reward:70,text:'找走丟的小黃：有人看到牠在'+d[0]+'（找到牠，牠會跟著你走回來）',ask:'小黃跑不見了！有人說看到牠在'+d[0]+'。可以幫我把牠帶回來嗎？',
      start(){dg.x=d[1];dg.z=d[2];dg.path=[];dg.think=0;dg.lost=[d[1],d[2]];dg.lead=false;}};}
