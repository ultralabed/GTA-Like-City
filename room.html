<title>夕陽小房間</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D view; a thin HUD floats on top (name top-left, switches under it, hint at the bottom). Single dark look on purpose. */
:root{
  color-scheme: dark;
  --ink:#0b0710;            /* room-at-night black, biased to violet */
  --glass:rgba(18,10,26,.58);
  --line:rgba(255,214,190,.22);
  --text:#fff1e6;           /* warm paper white */
  --muted:#d9bfc4;
  --sun:#ff9a4d;            /* sunset orange = accent */
  --neon:#ff4fa8;           /* neon pink = "on" state */
  --display:"Unbounded","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Inter","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;position:relative;
  -webkit-user-select:none;user-select:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:14px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(15px,2.4vw,22px);letter-spacing:.02em;
  text-shadow:0 2px 18px rgba(0,0,0,.7)}
h1 small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.switches{display:flex;flex-wrap:wrap;gap:8px;pointer-events:auto}
.switches button{font:600 13px/1 var(--body);color:var(--text);background:var(--glass);border:1px solid var(--line);
  padding:10px 13px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:7px}
.switches button::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.switches button[aria-pressed="true"]::before{background:var(--neon);box-shadow:0 0 10px var(--neon)}
.switches button:hover{border-color:var(--sun)}
.switches button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.hint{align-self:center;text-align:center;font-size:13px;line-height:1.5;color:var(--text);background:var(--glass);
  border:1px solid var(--line);border-radius:12px;padding:8px 14px;max-width:100%;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hint b{color:var(--sun);font-weight:600}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.4);pointer-events:none}
#tip{position:absolute;left:50%;top:calc(50% + 18px);transform:translateX(-50%);font-size:13px;font-weight:600;
  background:var(--glass);border:1px solid var(--sun);border-radius:8px;padding:6px 10px;pointer-events:none;white-space:nowrap}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.06);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,154,77,.55)}
.switches button.plain::before{display:none}
.clock{display:flex;align-items:center;gap:10px;pointer-events:auto;background:var(--glass);border:1px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:100%}
.clock output{font:700 14px/1 var(--display);font-variant-numeric:tabular-nums;min-width:3.3em}
.clock input{width:clamp(90px,24vw,200px);accent-color:var(--sun);min-width:0}
.clock button{font:600 12px/1 var(--body);color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);
  padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.clock button:focus-visible,.clock input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.phys{font-size:12px;line-height:1.45;color:var(--muted);background:var(--glass);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;max-width:min(100%,30em);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;
  background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
#err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:15px;line-height:1.6}
</style>

<canvas id="view" tabindex="0" aria-label="可以走動探索的 3D 房間"></canvas>
<div id="cross"></div>
<div id="tip" hidden></div>
<div id="joy" hidden><i></i></div>
<div id="tags"></div>
<div class="hud">
  <div class="top">
    <h1>夕陽小房間<small id="sub">28 樓 · 海景</small></h1>
    <div class="switches">
      <button id="bLamp" type="button" aria-pressed="false">立燈</button>
      <button id="bTv" type="button" aria-pressed="true">電視</button>
      <button id="bNeon" type="button" aria-pressed="true">霓虹燈</button>
      <button id="bOrb" type="button" aria-pressed="false">引力球</button>
      <button id="bGrav" type="button" class="plain">重力：地球</button>
    </div>
    <div class="clock">
      <output id="clk" for="time">18:40</output>
      <input id="time" type="range" min="0" max="23.99" step="0.01" value="18.67" aria-label="現在幾點">
      <button id="bSpeed" type="button">時間：正常</button>
    </div>
    <div id="phys" class="phys">物理：踢球、撞球，這裡會寫出誰推了誰。</div>
  </div>
  <div class="hint" id="hint"></div>
</div>
<div id="err" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const canvas=$('view');
const isTouch=matchMedia('(pointer:coarse)').matches;
$('hint').innerHTML=isTouch
  ? '<b>左手</b>拖：走路　<b>右手</b>拖：轉頭　<b>點</b>球：踢　<b>點</b>人：打招呼'
  : '<b>點畫面</b>鎖定滑鼠　<b>W A S D</b> 走路　<b>Shift</b> 跑　<b>點</b>球：踢　<b>點</b>人：打招呼　<b>Esc</b> 放開滑鼠';
function fail(msg){$('err').hidden=false;$('err').textContent=msg;}
if(!window.THREE){fail('3D 引擎沒有載入成功，請重新整理一次。');return;}

let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){fail('這個裝置或瀏覽器沒有開 WebGL，所以畫不出 3D 房間。');return;}
let pr=Math.min(window.devicePixelRatio||1,2);
renderer.setPixelRatio(pr);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05030a);
const camera=new THREE.PerspectiveCamera(68,1,0.05,80);
camera.rotation.order='YXZ';

/* ---------- procedural textures ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tex(c,srgb,rx,ry){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(srgb)t.encoding=THREE.sRGBEncoding;t.repeat.set(rx||1,ry||rx||1);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}

function woodTextures(){
  const S=1024,c=cv(S,S),b=cv(S,S),g=c.getContext('2d'),h=b.getContext('2d');
  h.fillStyle='#909090';h.fillRect(0,0,S,S);
  const rows=16,rh=S/rows;
  for(let r=0;r<rows;r++){
    let x=-rnd(0,400);
    while(x<S){
      const len=rnd(300,620),L=rnd(23,32),hue=rnd(24,31);
      g.fillStyle=`hsl(${hue},${rnd(28,38)}%,${L}%)`;g.fillRect(x,r*rh,len,rh);
      for(let i=0;i<46;i++){
        const y=r*rh+rnd(1,rh-1),a=rnd(.03,.11),dark=Math.random()<.6;
        g.strokeStyle=dark?`rgba(40,18,6,${a})`:`rgba(255,210,160,${a})`;g.lineWidth=rnd(.5,1.8);
        g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+len*.3,y+rnd(-3,3),x+len*.7,y+rnd(-3,3),x+len,y+rnd(-2,2));g.stroke();
        h.strokeStyle=`rgba(${dark?60:190},${dark?60:190},${dark?60:190},.08)`;h.lineWidth=1;
        h.beginPath();h.moveTo(x,y);h.lineTo(x+len,y);h.stroke();
      }
      g.fillStyle='rgba(15,6,2,.75)';g.fillRect(x+len-1.5,r*rh,3,rh);
      h.fillStyle='#1a1a1a';h.fillRect(x+len-1.5,r*rh,3,rh);
      x+=len;
    }
    g.fillStyle='rgba(15,6,2,.8)';g.fillRect(0,r*rh-1,S,2.5);
    h.fillStyle='#1a1a1a';h.fillRect(0,r*rh-1,S,2.5);
  }
  return [tex(c,true,.5),tex(b,false,.5)];
}
function noiseBump(size,dots,r0,r1,rep){
  const c=cv(size,size),g=c.getContext('2d');g.fillStyle='#808080';g.fillRect(0,0,size,size);
  for(let i=0;i<dots;i++){const v=Math.random()<.5?40:215;g.fillStyle=`rgba(${v},${v},${v},${rnd(.04,.14)})`;
    g.beginPath();g.arc(rnd(0,size),rnd(0,size),rnd(r0,r1),0,7);g.fill();}
  return tex(c,false,rep);
}
function weaveBump(rep){
  const c=cv(128,128),g=c.getContext('2d');g.fillStyle='#777';g.fillRect(0,0,128,128);
  for(let i=0;i<128;i+=4){g.fillStyle=`rgba(255,255,255,${rnd(.15,.4)})`;g.fillRect(i,0,2,128);
    g.fillStyle=`rgba(0,0,0,${rnd(.15,.4)})`;g.fillRect(0,i,128,2);}
  return tex(c,false,rep);
}
function rugTexture(){
  const c=cv(512,640),g=c.getContext('2d');
  g.fillStyle='#d9c9b0';g.fillRect(0,0,512,640);
  const cols=['#b5533a','#1f5a5e','#e0a45c','#3b2a3f'];
  for(let i=0;i<5;i++){g.strokeStyle=cols[i%4];g.lineWidth=i===0?26:9;const m=24+i*34;g.strokeRect(m,m,512-2*m,640-2*m);}
  for(let i=0;i<7;i++){g.fillStyle=cols[i%4];g.save();g.translate(256,150+i*57);g.rotate(Math.PI/4);g.fillRect(-18,-18,36,36);g.restore();}
  for(let i=0;i<9000;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:240},200,.05)`;g.fillRect(rnd(0,512),rnd(0,640),2,2);}
  const t=tex(c,true);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
function artTexture(seed){
  const c=cv(384,512),g=c.getContext('2d');
  const P=seed?['#f3e6d3','#e8527a','#1f5a5e','#ffb347','#2a1b5e']:['#f1e4cf','#1f5a5e','#ff9a4d','#3b2a3f','#e8527a'];
  g.fillStyle=P[0];g.fillRect(0,0,384,512);
  if(seed){g.fillStyle=P[3];g.beginPath();g.arc(192,230,120,Math.PI,0);g.fill();
    for(let i=0;i<6;i++){g.fillStyle=P[1+i%4];g.fillRect(40,250+i*36,304,18-i*2);}}
  else{g.fillStyle=P[1];g.fillRect(40,60,150,390);g.fillStyle=P[2];g.beginPath();g.arc(230,200,95,0,7);g.fill();
    g.fillStyle=P[3];g.fillRect(170,330,170,120);g.strokeStyle=P[4];g.lineWidth=7;g.beginPath();g.moveTo(40,470);g.lineTo(344,90);g.stroke();}
  const t=tex(c,true);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}
function palm(g,x,base,ht,lean,col){
  g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';
  const tx=x+lean,ty=base-ht;
  g.lineWidth=ht*.035;g.beginPath();g.moveTo(x,base);g.quadraticCurveTo(x+lean*.2,base-ht*.5,tx,ty);g.stroke();
  for(let i=0;i<11;i++){
    const a=-Math.PI*(.05+.9*i/10)+rnd(-.1,.1),L=ht*rnd(.34,.46);
    const ex=tx+Math.cos(a)*L,ey=ty+Math.sin(a)*L*.55+L*.38,cx=tx+Math.cos(a)*L*.55,cy=ty+Math.sin(a)*L*.75;
    g.lineWidth=ht*.012;g.beginPath();g.moveTo(tx,ty);g.quadraticCurveTo(cx,cy,ex,ey);g.stroke();
    for(let k=1;k<=12;k++){const t=k/13,px=(1-t)*(1-t)*tx+2*(1-t)*t*cx+t*t*ex,py=(1-t)*(1-t)*ty+2*(1-t)*t*cy+t*t*ey;
      g.lineWidth=ht*.007;g.beginPath();g.moveTo(px,py);g.lineTo(px+rnd(-4,4),py+ht*.07*(1-t*.5));g.stroke();}
  }
}
function skyTexture(mode){ // 0 dusk, 1 night, 2 day. The sun and moon are separate moving discs.
  const W=2048,Hh=1024,H=707,c=cv(W,Hh),g=c.getContext('2d'),night=mode===1;
  let gr=g.createLinearGradient(0,0,0,H);
  [[[0,'#24184f'],[.32,'#7a2c7c'],[.6,'#e3507a'],[.82,'#ff9450'],[1,'#ffd88a']],
   [[0,'#02030a'],[.55,'#0a1034'],[.88,'#231a55'],[1,'#4a2a6a']],
   [[0,'#1f5fc4'],[.5,'#5fa3e6'],[.85,'#b5dcf7'],[1,'#e6f4fb']]][mode].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  if(night)for(let i=0;i<500;i++){g.fillStyle=`rgba(255,255,255,${rnd(.2,.9)})`;g.fillRect(rnd(0,W),rnd(0,H*.8),rnd(1,2.4),rnd(1,2.4));}
  const cl=[['255,190,150','255,170,140','120,50,110'],['60,50,110','70,55,120','20,15,50'],['255,255,255','255,255,255','210,225,240']][mode];
  for(let i=0;i<16;i++){
    const x=rnd(0,W),y=rnd(120,620),w=rnd(180,520),hh=rnd(8,mode===2?40:26);
    gr=g.createLinearGradient(0,y-hh,0,y+hh);
    gr.addColorStop(0,`rgba(${cl[0]},0)`);gr.addColorStop(.5,`rgba(${cl[1]},${mode===2?.8:.55})`);gr.addColorStop(1,`rgba(${cl[2]},0)`);
    g.fillStyle=gr;g.beginPath();g.ellipse(x,y,w,hh,0,0,7);g.fill();
  }
  gr=g.createLinearGradient(0,H,0,Hh);
  [[[0,'#ffb27a'],[.25,'#c2567c'],[1,'#2a1648']],[[0,'#2c1d55'],[.3,'#0d0f2c'],[1,'#03040c']],[[0,'#9fd0ee'],[.3,'#3f8fcb'],[1,'#134a86']]][mode]
    .forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr;g.fillRect(0,H,W,Hh-H);
  const gl=['255,236,180','210,220,255','255,255,255'][mode];
  for(let i=0;i<220;i++){const y=H+4+Math.pow(Math.random(),1.6)*(Hh-H-8);
    g.fillStyle=`rgba(${gl},${rnd(.1,night?.3:.6)})`;g.fillRect(rnd(0,W),y,rnd(14,70),rnd(1.5,3.5));}
  let x=0;while(x<W){
    const w=rnd(12,34),hh=Math.random()<.12?rnd(50,84):rnd(8,40);
    g.fillStyle=['#22123a','#070515','#6f84a6'][mode];g.fillRect(x,H-hh,w,hh+3);
    for(let wy=H-hh+3;wy<H-3;wy+=5)for(let wx=x+2;wx<x+w-3;wx+=4)if(Math.random()<[.15,.45,0][mode]){
      g.fillStyle=Math.random()<.2?'#7fe9ff':(Math.random()<.2?'#ff7ac0':'#ffd98a');g.fillRect(wx,wy,2,2.5);}
    x+=w+rnd(0,6);
  }
  const pc=['#0c0612','#06040c','#12301c'][mode];
  palm(g,330,Hh+20,520,60,pc);palm(g,560,Hh+30,400,-45,pc);palm(g,1700,Hh+20,560,-70,pc);palm(g,1880,Hh+30,380,40,pc);
  const t=tex(c,true);t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;return t;
}

/* ---------- materials ---------- */
const [woodMap,woodBump]=woodTextures();
const plaster=noiseBump(256,2600,1,5,1.5), weave=weaveBump(7);
const M={
  floor:new THREE.MeshStandardMaterial({map:woodMap,bumpMap:woodBump,bumpScale:.006,roughness:.3}),
  wall:new THREE.MeshStandardMaterial({color:0xe4dacb,bumpMap:plaster,bumpScale:.003,roughness:.92}),
  accent:new THREE.MeshStandardMaterial({color:0x1c4a50,bumpMap:plaster,bumpScale:.003,roughness:.88}),
  ceil:new THREE.MeshStandardMaterial({color:0xf1ece4,roughness:.95}),
  trim:new THREE.MeshStandardMaterial({color:0xf4efe6,roughness:.55}),
  walnut:new THREE.MeshStandardMaterial({color:0x56351f,roughness:.48,bumpMap:woodBump,bumpScale:.002}),
  sofa:new THREE.MeshStandardMaterial({color:0xd9cdbb,bumpMap:weave,bumpScale:.006,roughness:.95}),
  coral:new THREE.MeshStandardMaterial({color:0xc4553b,bumpMap:weave,bumpScale:.006,roughness:.9}),
  teal:new THREE.MeshStandardMaterial({color:0x1f6a6e,bumpMap:weave,bumpScale:.006,roughness:.9}),
  linen:new THREE.MeshStandardMaterial({color:0xefe4d2,bumpMap:weave,bumpScale:.004,roughness:1}),
  black:new THREE.MeshStandardMaterial({color:0x0c0c0e,roughness:.35,metalness:.9}),
  brass:new THREE.MeshStandardMaterial({color:0xb48a48,roughness:.24,metalness:1}),
  glass:new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.03,metalness:0,transparent:true,opacity:.1,depthWrite:false}),
  ceramic:new THREE.MeshStandardMaterial({color:0xe9e2d6,roughness:.25}),
  terracotta:new THREE.MeshStandardMaterial({color:0xa9583a,roughness:.8}),
  leaf:new THREE.MeshStandardMaterial({color:0x2c6a34,roughness:.5}),
  rug:new THREE.MeshStandardMaterial({map:rugTexture(),bumpMap:weave,bumpScale:.01,roughness:1})
};

/* ---------- builders ---------- */
const colliders=[],interact=[];
function scaleUV(g,w,h,d){const uv=g.attributes.uv,dm=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let i=0;i<uv.count;i++){const f=dm[Math.floor(i/4)];uv.setXY(i,uv.getX(i)*f[0],uv.getY(i)*f[1]);}}
function add(m,shadow){m.castShadow=shadow!==false;m.receiveShadow=true;scene.add(m);return m;}
function box(w,h,d,mat,x,y,z,o){o=o||{};
  let g;if(o.r&&THREE.RoundedBoxGeometry)g=new THREE.RoundedBoxGeometry(w,h,d,4,o.r);else{g=new THREE.BoxGeometry(w,h,d);scaleUV(g,w,h,d);}
  const m=new THREE.Mesh(g,mat);m.position.set(x,y,z);if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;return add(m,o.shadow);}
function cyl(rt,rb,h,mat,x,y,z,seg,open){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||28,1,!!open),mat);m.position.set(x,y,z);return add(m);}
function solid(x0,x1,z0,z1){colliders.push([x0,x1,z0,z1]);}

/* ---------- room shell: 6 m x 5 m, 2.8 m high. Window on the -z wall ---------- */
const RW=3,RD=2.5,RH=2.8,T=.16;
box(6+2*T,T,5+2*T,M.floor,0,-T/2,0);
box(6+2*T,T,5+2*T,M.ceil,0,RH+T/2,0);
box(T,RH,5,M.wall,-RW-T/2,RH/2,0);
box(T,RH,5,M.accent,RW+T/2,RH/2,0);

  const duskW=ss(-.3,-.02,se),dayW=ss(.12,.5,se);dark=1-duskW;

        basket.v.x+=kx/kl*J/basket.m;basket.v.z+=kz/kl*J/basket.m;basket.v.y+=1.8;n.kickCd=2.5;n.path=[];n.repath=1.2;
        say(n.o.name+'踢了籃球：球被推 '+J.toFixed(1)+' 牛頓·秒，'+n.o.name+'的腳也被球往回推一樣多。');}
      else if(n.repath<=0){n.repath=.8;n.path=bd>.4?(findPath(n.pos.x,n.pos.z,basket.p.x,basket.p.z)||[]):[];}
    }
    if(n.path.length){
      if(dP<.65&&n.wait<2){n.wait+=dt;tyaw=Math.atan2(dpx,dpz);}             // you are in the way: stop and look at you
      else{if(dP>.9)n.wait=0;
        const q=n.path[0],dx=q[0]-n.pos.x,dz=q[1]-n.pos.z,d=Math.hypot(dx,dz),stp=1.15*dt;
        if(d<=stp){n.pos.x=q[0];n.pos.z=q[1];n.path.shift();}else{n.pos.x+=dx/d*stp;n.pos.z+=dz/d*stp;tyaw=Math.atan2(dx,dz);}
        name='walk';n.ph+=dt*7.2;}
    }else if(!A.chase){n.phase='in';n.settle=0;}
  }else{                                                  // settle in, then stay
    const q=A.an||[A.ap[0],n.stand,A.ap[1]];
    n.pos.x+=(q[0]-n.pos.x)*k4;n.pos.z+=(q[2]-n.pos.z)*k4;ty=q[1];tyaw=A.yaw||0;name=A.pose;lie=!!A.lie;n.settle+=dt;
    if(n.phase==='in'&&n.settle>1){n.phase='at';if(A.hide){n.hidden=true;n.root.visible=false;n.tag.hidden=true;return;}}
  }
  n.lie=lie;n.sit=name==='sit';
  n.vx=(n.pos.x-ox)/dt;n.vz=(n.pos.z-oz)/dt;
  n.yaw+=angDiff(tyaw,n.yaw)*(1-Math.exp(-dt*8));
  n.y+=(ty-n.y)*(1-Math.exp(-dt*6));
  pose(P,name,n,t);
  if(!lie){
    if(dP<2.3&&name!=='dance')P.ny=Math.max(-1.1,Math.min(1.1,angDiff(Math.atan2(dpx,dpz),n.yaw)));
    if(n.wave>0){n.wave-=dt;P.arx=-2.7;P.arz=-.25+Math.sin(t*11)*.35;P.erx=-.35;label='嗨！';}
  }
  const kp=1-Math.exp(-dt*(name==='walk'?20:9));JK.forEach(k=>n.cur[k]+=(P[k]-n.cur[k])*kp);
  const c=n.cur,J=n.J;
  J.spine.rotation.set(c.sx,0,c.sz);J.neck.rotation.set(c.nx,c.ny,0);
  J.al.rotation.set(c.alx,0,c.alz);J.ar.rotation.set(c.arx,0,c.arz);J.el.rotation.x=c.elx;J.er.rotation.x=c.erx;
  J.hl.rotation.x=c.hlx;J.hr.rotation.x=c.hrx;J.kl.rotation.x=c.klx;J.kr.rotation.x=c.krx;
  n.book.visible=name==='read';
  n.root.position.set(n.pos.x,n.y+c.yo,n.pos.z);
  n.root.quaternion.slerp(lie?lieQ:qT.setFromAxisAngle(up3,n.yaw),1-Math.exp(-dt*5));
  // name tag above the head
  n.head.getWorldPosition(hv);hv.y+=.3;hv.project(camera);
  const show=hv.z<1&&Math.abs(hv.x)<1.1&&Math.abs(hv.y)<1.1;n.tag.hidden=!show;
  if(show){n.tag.style.left=((hv.x+1)/2*canvas.clientWidth)+'px';n.tag.style.top=((1-hv.y)/2*canvas.clientHeight)+'px';
    const txt=n.o.name+(label?' · '+label:'');if(txt!==n.tagText){n.tagText=txt;n.tag.textContent=txt;}}
}
// the people run the house: lamp on when it is dark and someone is up, TV on only while someone watches
let wantLamp=null,wantTv=null,subText='';
function autoHome(){
  let awake=false,watching=false;const home=[];
  for(const n of people){if(n.hidden)continue;home.push(n.o.name);if(!n.lie)awake=true;if(ACT[n.act].tv&&n.phase==='at')watching=true;}
  const wl=dark>.5&&awake;
  if(wl!==wantLamp){wantLamp=wl;if(S.lamp!==wl){S.lamp=wl;applySwitches();}}
  if(watching!==wantTv){wantTv=watching;if(S.tv!==watching){S.tv=watching;applySwitches();}}
  const txt='28 樓 · '+(home.length?'在家：'+home.join('、'):'沒有人在家');
  if(txt!==subText){subText=txt;$('sub').textContent=txt;}
}

/* ---------- reflections: photograph the room itself and use it as the mirror image ---------- */
const pmrem=new THREE.PMREMGenerator(renderer);let envRT=null;
function bakeEnv(){
  const hadDust=dust.visible;dust.visible=false;dyn.visible=false;scene.environment=null;
  scene.position.y=-1.4;scene.updateMatrixWorld(true);
  const rt=pmrem.fromScene(scene,.03,.05,60);
  scene.position.y=0;scene.updateMatrixWorld(true);dust.visible=hadDust;dyn.visible=true;
  scene.environment=rt.texture;if(envRT)envRT.dispose();envRT=rt;
}

/* ---------- post-processing: bloom + film tone curve ---------- */
let composer=null,finalPass=null;
const canHDR=renderer.capabilities.isWebGL2&&(renderer.extensions.has('EXT_color_buffer_float')||renderer.extensions.has('EXT_color_buffer_half_float'));
if(canHDR&&THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.ShaderPass&&THREE.RenderPass){
  const rt=new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:4});
  composer=new THREE.EffectComposer(renderer,rt);
  composer.addPass(new THREE.RenderPass(scene,camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(256,256),.5,.55,.95));
  finalPass=new THREE.ShaderPass({
    uniforms:{tDiffuse:{value:null},exposure:{value:1},time:{value:0},res:{value:new THREE.Vector2(1,1)}},
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`uniform sampler2D tDiffuse;uniform float exposure;uniform float time;uniform vec2 res;varying vec2 vUv;
      vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);}
      void main(){vec2 c=vUv-0.5;float d=dot(c,c);vec2 o=c*d*0.006;
        vec3 col=vec3(texture2D(tDiffuse,vUv-o).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv+o).b);
        col*=exposure*(1.0-d*0.85);
        float l=dot(col,vec3(0.2126,0.7152,0.0722));
        col=mix(col,col*vec3(0.92,1.0,1.1),clamp(1.0-l*3.0,0.0,1.0)*0.35);
        col=aces(col);col=pow(col,vec3(1.0/2.2));
        float n=fract(sin(dot(vUv*res+time,vec2(12.9898,78.233)))*43758.5453);
        gl_FragColor=vec4(col+(n-0.5)*0.022,1.0);}`
  });
  composer.addPass(finalPass);
}else{
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.outputEncoding=THREE.sRGBEncoding;
}

function resize(){
  const w=canvas.clientWidth||innerWidth,h=canvas.clientHeight||innerHeight;
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?82:68;camera.updateProjectionMatrix();
  if(composer){composer.setPixelRatio(pr);composer.setSize(w,h);finalPass.uniforms.res.value.set(w*pr,h*pr);}
}
addEventListener('resize',resize);resize();

/* ---------- walking + looking ---------- */
const pos=new THREE.Vector3(1.9,1.6,1.3);let yaw=.62,pitch=-.06;
const vel={x:0,z:0},keys={},joy={x:0,y:0,id:null,ox:0,oy:0},look={id:null,x:0,y:0};
let down=null,bob=0,locked=false;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const PR=.3;
function blocked(x,z){
  if(x<-RW+PR||x>RW-PR||z<-RD+PR||z>RD-PR)return true;
  for(const c of colliders)if(x>c[0]-PR&&x<c[1]+PR&&z>c[2]-PR&&z<c[3]+PR)return true;
  for(const n of people){if(n.hidden||n.lie)continue; // people are solid, but you can always step away from them
    const d=Math.hypot(x-n.pos.x,z-n.pos.z);if(d<.5&&d<Math.hypot(pos.x-n.pos.x,pos.z-n.pos.z))return true;}
  return false;
}
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
  if(e.code==='KeyE')tryInteract(0,0);});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===canvas;});
document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;clampPitch();}});
function clampPitch(){pitch=Math.max(-1.35,Math.min(1.35,pitch));}
const ray=new THREE.Raycaster();ray.far=4.5;const ndc=new THREE.Vector2();let hoverNdc={x:0,y:0};
function pick(x,y){ndc.set(x,y);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(interact,false);for(const i of h){const n=i.object.userData.npc;if(!n||!n.hidden)return i.object;}return null;}
function tryInteract(x,y){const o=pick(x,y);if(o){o.userData.act();return true;}return false;}
function toNdc(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height*2-1)};}
canvas.addEventListener('pointerdown',e=>{
  canvas.focus({preventScroll:true});
  if(e.pointerType==='touch'){
    try{canvas.setPointerCapture(e.pointerId);}catch(_){}
    if(e.clientX<innerWidth*.45&&joy.id===null){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;
      const j=$('joy');j.hidden=false;j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';}
    else if(look.id===null){look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;}
  }else if(!locked){look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY;try{canvas.setPointerCapture(e.pointerId);}catch(_){}}
  down={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now()};
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'&&!locked)hoverNdc=toNdc(e);
  if(e.pointerId===joy.id){let dx=(e.clientX-joy.ox)/48,dy=(e.clientY-joy.oy)/48;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
    joy.x=dx;joy.y=-dy;$('joy').firstElementChild.style.transform=`translate(${dx*34}px,${dy*34}px)`;}
  else if(e.pointerId===look.id){const k=e.pointerType==='touch'?.005:.004;
    yaw-=(e.clientX-look.x)*k;pitch-=(e.clientY-look.y)*k;clampPitch();look.x=e.clientX;look.y=e.clientY;}
});
function up(e){
  if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$('joy').hidden=true;$('joy').firstElementChild.style.transform='';}
  if(e.pointerId===look.id)look.id=null;
  if(down&&down.id===e.pointerId&&e.type==='pointerup'){
    const tap=performance.now()-down.t<300&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<8;
    if(tap){
      if(locked)tryInteract(0,0);
      else{const p=toNdc(e);
        if(!tryInteract(p.x,p.y)&&e.pointerType!=='touch'&&canvas.requestPointerLock){
          try{const r=canvas.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(_){}}}
    }
  }
  if(down&&down.id===e.pointerId)down=null;
}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- TV programme: an endless neon road ---------- */
function drawTV(t){
  const g=tvG,W=256,H=144,hz=78;
  let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#1a0b3d');gr.addColorStop(1,'#ff4f9a');g.fillStyle=gr;g.fillRect(0,0,W,hz);
  g.fillStyle='#ffd36a';g.beginPath();g.arc(128,hz,34,Math.PI,0);g.fill();
  g.fillStyle='#ff4f9a';for(let i=0;i<4;i++)g.fillRect(90,hz-8-i*7,76,2+i*.5);
  g.fillStyle='#0a0420';g.fillRect(0,hz,W,H-hz);
  g.strokeStyle='#35e6ff';g.lineWidth=1;
  for(let i=-10;i<=10;i++){g.beginPath();g.moveTo(128+i*6,hz);g.lineTo(128+i*60,H);g.stroke();}
  for(let i=0;i<8;i++){const u=((i+t*.9)%8)/8,y=hz+u*u*(H-hz);g.globalAlpha=.3+u*.7;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  g.globalAlpha=1;tvTex.needsUpdate=true;
}

/* ---------- main loop ---------- */
let last=performance.now(),frame=0,slow=0,tipObj=null,acc=0,bakeAt=0,bakeClock=clock,autoT=1;
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.max(.001,Math.min(.05,(now-last)/1000));last=now;frame++;const t=now/1000;
  // time passes
  if(!sliding)clock=(clock+dt*SPEEDS[speedIdx][0])%24;
  applyTime();
  if(frame%20===0&&!sliding)slider.value=clock;
  let dc=Math.abs(clock-bakeClock);dc=Math.min(dc,24-dc);
  if(dc>.2&&t-bakeAt>2.5)envDirty=true;
  // you
  const f=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+joy.y;
  const s=(keys.KeyD?1:0)-(keys.KeyA?1:0)+joy.x;
  if(keys.ArrowLeft)yaw+=1.9*dt;if(keys.ArrowRight)yaw-=1.9*dt;
  const sp=(keys.ShiftLeft||keys.ShiftRight)?3.3:1.9,sn=Math.sin(yaw),cs=Math.cos(yaw);
  let tx=(-sn*f+cs*s),tz=(-cs*f-sn*s);const tl=Math.hypot(tx,tz);if(tl>1){tx/=tl;tz/=tl;}
  const e=1-Math.exp(-dt*10);vel.x+=(tx*sp-vel.x)*e;vel.z+=(tz*sp-vel.z)*e;
  const nx=pos.x+vel.x*dt;if(!blocked(nx,pos.z))pos.x=nx;else vel.x=0;
  const nz=pos.z+vel.z*dt;if(!blocked(pos.x,nz))pos.z=nz;else vel.z=0;
  const v=Math.hypot(vel.x,vel.z);bob+=v*dt*3.6;
  camera.position.set(pos.x,pos.y+(reduce?0:Math.sin(bob*2)*.018*Math.min(1,v)),pos.z);
  camera.rotation.set(pitch,yaw,0);camera.updateMatrixWorld();
  // the people, then the physics in small fixed steps
  for(const n of people)updNPC(n,dt,t);
  autoT+=dt;if(autoT>.5){autoT=0;autoHome();}
  acc+=dt;let steps=0;while(acc>=PH&&steps<14){physStep(PH);acc-=PH;steps++;}if(steps===14)acc=0;
  syncBalls(dt);
  // lights that live
  const k=S.neon?1:0;neonL.intensity=k*(.3+.2*dark);neonL2.intensity=k*(.18+.12*dark);
  if(S.tv){if(frame%3===0)drawTV(t);tvL.intensity=(.18+.12*dark)*(1+Math.sin(t*5.3)*.08+Math.sin(t*13.1)*.05);}else tvL.intensity=0;
  if(dust.visible){const p=dGeo.attributes.position;for(let i=0;i<DN;i++){let y=p.getY(i)+Math.sin(t*.4+i)*.0006-.0004;if(y<.15)y=2.3;p.setY(i,y);p.setX(i,p.getX(i)+Math.cos(t*.3+i*1.7)*.0005);}p.needsUpdate=true;}
  exposure+=(exposureTarget-exposure)*(1-Math.exp(-dt*3));
  if(envDirty){envTimer+=dt;if(frame<3||envTimer>.12){bakeEnv();envDirty=false;bakeAt=t;bakeClock=clock;}}
  // what am I pointing at?
  if(frame%6===0){const o=isTouch?null:(locked?pick(0,0):pick(hoverNdc.x,hoverNdc.y));
    if(o!==tipObj){tipObj=o;const tip=$('tip');tip.hidden=!o;if(o)tip.textContent=o.userData.tip||('點一下：開關'+o.userData.label);canvas.style.cursor=o?'pointer':'grab';}
    $('cross').style.opacity=locked?1:0;}
  if(composer){finalPass.uniforms.exposure.value=exposure;finalPass.uniforms.time.value=t%10;composer.render();}
  else{renderer.toneMappingExposure=exposure;renderer.render(scene,camera);}
  // if the device struggles, draw fewer pixels so walking stays smooth
  if(frame>90){slow=dt>.034?slow+1:Math.max(0,slow-1);if(slow>45&&pr>.75){pr=Math.max(.75,pr-.25);slow=0;resize();}}
}
scene.traverse(o=>{if(o.material&&'envMapIntensity' in o.material)o.material.envMapIntensity=.45;});
applySwitches();applyTime();drawTV(0);
window.__room={get clock(){return clock;},set clock(v){clock=v;envDirty=true;},people,bodies,S};
requestAnimationFrame(tick);
})();
